plugins {
    id 'java'
}

version '1.2.0'

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

sourceSets.main.java.srcDirs = ['src']

def mindustryJar = file("$buildDir/dependencies/Mindustry.jar")

dependencies {
    compileOnly files(mindustryJar)
}

tasks.register('downloadMindustry') {
    outputs.file(mindustryJar)
    doLast {
        if (!mindustryJar.exists() || mindustryJar.length() < 1000000L) {
            mindustryJar.parentFile.mkdirs()
            def downloadFile = new File(mindustryJar.parentFile, 'Mindustry.jar.download')
            if (downloadFile.exists()) downloadFile.delete()
            new URL('https://github.com/Anuken/Mindustry/releases/download/v160.7/Mindustry.jar').withInputStream { input ->
                downloadFile.withOutputStream { output -> output << input }
            }
            if (downloadFile.length() < 1000000L) {
                downloadFile.delete()
                throw new GradleException('Downloaded Mindustry.jar is incomplete.')
            }
            if (mindustryJar.exists()) mindustryJar.delete()
            if (!downloadFile.renameTo(mindustryJar)) {
                throw new GradleException('Could not move downloaded Mindustry.jar into place.')
            }
        }
    }
}

compileJava.dependsOn downloadMindustry

jar {
    archiveFileName = 'Custom-AutoDrill.jar'

    from(rootDir) {
        include 'mod.hjson'
    }

    from('assets/') {
        include '**'
    }
}
