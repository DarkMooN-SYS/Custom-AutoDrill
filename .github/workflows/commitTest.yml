name: Build and publish mod

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  buildJar:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - name: Build mod jar
      run: ./gradlew jar
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: Custom-AutoDrill
        path: build/libs/AutoDrillDesktop.jar
    - name: Publish Mindustry release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        tag="build-${GITHUB_SHA:0:7}"
        gh release create "$tag" build/libs/AutoDrillDesktop.jar \
          --title "Custom AutoDrill [v160]" \
          --notes "Auto-built from commit ${GITHUB_SHA}. Supports Mindustry v160."
