name: Pull Request Build

on: [pull_request]

jobs:
  buildJar:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - name: Build mod jar
      run: ./gradlew jar
    - name: Upload built jar file
      uses: actions/upload-artifact@v4
      with:
        name: Custom-AutoDrill Pull Request
        path: build/libs/AutoDrillDesktop.jar
